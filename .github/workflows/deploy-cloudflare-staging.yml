name: Deploy Cloudflare staging
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/contracts/**'
      - '.github/workflows/deploy-cloudflare-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --global npm@11.21.0
      - run: npm ci
      - run: npm run check
      - name: Migrate D1 and deploy staging Worker with R2 storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          AUTH_JWKS_URL: ${{ vars.AUTH_JWKS_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: |
          npm run dry-run
          npx wrangler r2 bucket create "${R2_BUCKET_NAME:-kidsuu-storage}" || true
          npm run db:migrate:staging
          npm run deploy:staging
          npm run storage:sync:staging
